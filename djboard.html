<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Laufschrift</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
}
.board {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
}
.text {
  position: absolute;
  white-space: nowrap;
  font-family: Arial, sans-serif;
  font-size: 64px;
  font-weight: 700;
  color: white;
  text-shadow: 2px 2px 4px #000;
  animation: lauf 18s linear infinite;
}
@keyframes lauf {
  from { transform: translateX(100vw); }
  to   { transform: translateX(-100%); }
}
</style>
</head>
<body>
<div class="board">
  <div class="text" id="text">WILLKOMMEN BEIM DJ</div>
</div>
<script>
const p = new URLSearchParams(window.location.search);
const text = p.get("text");
if (text) document.getElementById("text").textContent = text;
</script>
</body>
</html>
