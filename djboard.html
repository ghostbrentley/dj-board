<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.board {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.text {
    position: absolute;

    top: 50%;
    left: 0;

    white-space: nowrap;

    font-family: Arial, sans-serif;
    font-size: 64px;
    font-weight: bold;
    color: white;

    transform: translateY(-50%);

    animation:
        laufen 15s linear infinite;
}

@keyframes laufen {

    0% {
        left: 100%;
        transform:
            translateY(-50%)
            translateX(0);
    }

    100% {
        left: 0%;
        transform:
            translateY(-50%)
            translateX(-100%);
    }
}
</style>
</head>

<body>

<div class="board">
    <div
        class="text"
        id="lauftext">
        WILLKOMMEN
    </div>
</div>

<script>
const params =
    new URLSearchParams(
        window.location.search
    );

const neuerText =
    params.get("text");

if (neuerText) {
    document.getElementById(
        "lauftext"
    ).textContent = neuerText;
}
</script>

</body>
</html>
