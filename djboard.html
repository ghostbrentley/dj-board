<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ghost DJ Board</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.board {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.text {
    position: absolute;

    top: 50%;
    left: 0;

    white-space: nowrap;

    font-family: Arial, sans-serif;
    font-size: 64px;
    font-weight: bold;

    color: #FFFFFF;

    text-shadow:
        2px 2px 4px #000000;

    transform: translateY(-50%);

    animation:
        laufen 15s linear infinite;
}


/* =========================================
   LAUFSCHRIFT
   rechts rein -> links raus
   ========================================= */

@keyframes laufen {

    0% {
        left: 100%;

        transform:
            translateY(-50%)
            translateX(0);
    }

    100% {
        left: 0%;

        transform:
            translateY(-50%)
            translateX(-100%);
    }
}
</style>
</head>


<body>

<div class="board">

    <div
        class="text"
        id="lauftext">
        WILLKOMMEN BEI GHOST BRENTLEY
    </div>

</div>


<script>

// =========================================
// TEXT AUS SECOND LIFE HOLEN
// =========================================

const params =
    new URLSearchParams(
        window.location.search
    );

const neuerText =
    params.get("text");

const lauftext =
    document.getElementById(
        "lauftext"
    );

if (neuerText) {
    lauftext.textContent =
        neuerText;
}


// =========================================
// FARBEN
// =========================================

const farben = [
    "#FFFFFF", // Weiss
    "#FF3030", // Rot
    "#00FF66", // Gruen
    "#33AAFF", // Blau
    "#FFFF00", // Gelb
    "#FF33CC", // Pink
    "#FF8800"  // Orange
];

let farbe = 0;


// =========================================
// NACH JEDEM DURCHLAUF
// FARBE WECHSELN
// =========================================

lauftext.addEventListener(
    "animationiteration",
    function () {

        farbe++;

        if (farbe >= farben.length) {
            farbe = 0;
        }

        lauftext.style.color =
            farben[farbe];
    }
);

</script>

</body>
</html>
